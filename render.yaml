services:
  - type: web
    name: planit-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm run start -w server
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: planit-frontend
    runtime: static
    buildCommand: npm install && npm run build -w frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://planit-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
